name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # MLflow and Kaggle are deliberately NOT installed: the pipeline must run without them.
      # CI cannot download Lending Club data, so all tests use SYNTHETIC data.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest==9.1.1 httpx==0.28.1
          pip install --no-deps -e .
      - name: Run tests (SYNTHETIC data)
        run: pytest -v
      - name: Smoke-run training CLI (SYNTHETIC data)
        run: python train.py --synthetic 20000 --no-mlflow
